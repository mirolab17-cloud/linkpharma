name: LinkPharma V61 checks

on:
  pull_request:
    branches: [main]
    paths:
      - "v61/**"
      - ".github/workflows/v61-checks.yml"
  push:
    branches: [v61]
    paths:
      - "v61/**"
      - ".github/workflows/v61-checks.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: v61
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: v61/package-lock.json
      - name: Install dependencies
        run: npm ci --legacy-peer-deps --no-audit --no-fund
      - name: TypeScript validation
        run: npm run lint
      - name: Catalog import tests
        run: npm run test:catalog-import
      - name: Product matching tests
        run: npm run test:product-matching
      - name: Quick link tests
        run: npm run test:quick-link
      - name: Firestore rules tests
        run: npm run test:rules:emulator
      - name: Production build
        run: npm run build
