name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        # Firebase 12 and rules-unit-testing 6 currently declare incompatible peer ranges.
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Build application
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_DATABASE_ID: ${{ secrets.VITE_FIREBASE_DATABASE_ID }}
          VITE_ONESIGNAL_APP_ID: ${{ secrets.VITE_ONESIGNAL_APP_ID }}
          VITE_PUSH_WORKER_URL: ${{ secrets.VITE_PUSH_WORKER_URL }}
        run: |
          npm run build
          touch dist/.nojekyll
          # Build v1 (LinkPharma_Final) and publish it under /v1/
          cd v1
          npm install --legacy-peer-deps --no-audit --no-fund
          npm run build
          mkdir -p ../dist/v1
          cp -r dist/. ../dist/v1/
          cd ..
          # Build v2 (new pharmacy home dashboard) and publish it under /v2/
          cd v2
          npm install --legacy-peer-deps --no-audit --no-fund
          npm run build
          mkdir -p ../dist/v2
          cp -r dist/. ../dist/v2/
          cd ..
          # Build v3 (latest pharmacy profile and mobile UX) and publish it under /v3/
          cd v3
          npm install --legacy-peer-deps --no-audit --no-fund
          npm run build
          mkdir -p ../dist/v3
          cp -r dist/. ../dist/v3/
          cd ..
          # Build v4 (admin control center, Gaza locations and owner profile) under /v4/
          cd v4
          npm install --legacy-peer-deps --no-audit --no-fund
          npm run build
          mkdir -p ../dist/v4
          cp -r dist/. ../dist/v4/
          cd ..
          # Build v5 (Pharma Link branding, light theme, PWA and Firebase permissions fix) under /v5/
          cd v5
          npm install --legacy-peer-deps --no-audit --no-fund
          npm run build
          mkdir -p ../dist/v5
          cp -r dist/. ../dist/v5/
          cd ..

          # Build v6 (auth session restoration fix) under /v6/
          cd v6
          npm install --legacy-peer-deps --no-audit --no-fund
          npm run build
          mkdir -p ../dist/v6
          cp -r dist/. ../dist/v6/
          cd ..

          # Build v7 (v5 design + login delay fix) under /v7/
          cd v7
          npm install --legacy-peer-deps --no-audit --no-fund
          npm run build
          mkdir -p ../dist/v7
          cp -r dist/. ../dist/v7/
          cd ..
          # Build v8 (stable Google auth and legacy profile compatibility) under /v8/
          cd v8
          npm install --legacy-peer-deps --no-audit --no-fund
          npm run build
          mkdir -p ../dist/v8
          cp -r dist/. ../dist/v8/
          cd ..
          # Build v9 (persistent auth, admin discovery and protected order queries) under /v9/
          cd v9
          npm install --legacy-peer-deps --no-audit --no-fund
          npm run build
          mkdir -p ../dist/v9
          cp -r dist/. ../dist/v9/
          cd ..
          # Build v10 (catalog import, normalized product matching and persistent notifications) under /v10/
