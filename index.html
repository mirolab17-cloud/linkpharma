    <script>
      (function() {
        try {
          var origFetch = window.fetch;
          if (origFetch) {
            var _fetch = typeof origFetch === 'function' ? origFetch.bind(window) : origFetch;
            Object.defineProperty(window, 'fetch', {
              get: function() { return _fetch; },
              set: function(val) { _fetch = val; },
              configurable: true,
              enumerable: true
            });
          }
        } catch (_) {}

        // Filter known browser extension and Firebase Auth internal popup race condition errors
        function isIgnoredError(msg, file) {
          if (!msg && !file) return false;
          var s = (msg || '') + ' ' + (file || '');
          return s.indexOf('chrome-extension') !== -1 ||
                 s.indexOf('Cannot set property fetch') !== -1 ||
                 s.indexOf('Pending promise was never set') !== -1 ||
                 s.indexOf('INTERNAL ASSERTION FAILED') !== -1;
        }

        try {
          var origError = console.error;
          console.error = function() {
            var first = arguments[0];
            var msg = typeof first === 'string' ? first : (first && first.message ? first.message : '');
            if (isIgnoredError(msg)) {
              console.warn.apply(console, arguments);
              return;
            }
            origError.apply(console, arguments);
          };
        } catch (_) {}

        window.addEventListener('error', function(event) {
          if (!event) return;
          var msg = event.message || (event.error && event.error.message) || '';
          var file = event.filename || '';
          if (isIgnoredError(msg, file)) {
            event.stopImmediatePropagation();
            event.preventDefault();
            return true;
          }
        }, true);

        window.addEventListener('unhandledrejection', function(event) {
          if (!event) return;
          var reason = event.reason;
          var msg = typeof reason === 'string' ? reason : (reason && reason.message ? reason.message : '');
          if (isIgnoredError(msg)) {
            event.stopImmediatePropagation();
            event.preventDefault();
            return true;
          }
        }, true);
      })();
    </script>
