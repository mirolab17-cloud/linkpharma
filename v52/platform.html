          // بينما تُحذف ملفات assets القديمة بعد نشر الإصدار الجديد. نظّف
          // الكاش مرة واحدة ثم أعد تحميل الصفحة بعنوان جديد بدل عرض صفحة خطأ.
          if (/dynamically imported module|loading chunk|failed to fetch|importing a module script|module script/i.test(msg)) {

      #lp-boot{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:#f8fafc;font-family:Cairo,Tahoma,Arial,sans-serif;color:#0f3d3a}
